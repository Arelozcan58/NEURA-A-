<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI | Groq Powered</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; --border: #1e293b; --input-bg: #111827; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Responsive */
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel); transition: 0.3s; z-index: 2000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { .sidebar { position: relative; left: 0; } .menu-toggle { display: none; } }
        .sidebar.active { left: 0; }

        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        #chatBox { flex: 1; overflow-y: auto; padding: 70px 20px 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .top-bar { position: absolute; top: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(5, 7, 10, 0.8); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .user { background: var(--accent); align-self: flex-end; color: white; border-bottom-right-radius: 4px; }
        .ai { background: #1e293b; align-self: flex-start; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; }
        .overlay.active { display: block; }
        
        .btn { cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    
    <div class="sidebar" id="sidebar">
        <div id="uName" style="font-weight:bold; color:var(--accent); margin-bottom:20px;">Yükleniyor...</div>
        <button class="btn" id="newChatBtn" style="width:100%; background:var(--accent); color:white; padding:12px; border-radius:12px; font-weight:bold;">
            <i class="fas fa-plus"></i> Yeni Sohbet
        </button>
        <div id="sessionList" style="flex:1; overflow-y:auto; margin-top:20px; display:flex; flex-direction:column; gap:8px;"></div>
        
        <div style="padding-top:15px; border-top:1px solid var(--border);">
            <select id="vSel" style="width:100%; padding:10px; border-radius:10px; background:var(--input-bg); color:white; border:1px solid var(--border); margin-bottom:10px;">
                <option value="none">🔇 Ses Kapalı</option>
                <option value="f" selected>👩 Kadın Sesi</option>
                <option value="m">👨 Erkek Sesi</option>
            </select>
            <button class="btn" id="logoutBtn" style="width:100%; background:#ef4444; color:white; padding:10px; border-radius:10px; font-weight:bold;">
                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle btn" id="menuBtn" style="background:none; color:white; font-size:1.3rem;"><i class="fas fa-bars"></i></button>
            <span style="font-weight:bold; letter-spacing:1px;">NEURA <span style="color:var(--accent);">AI</span></span>
            <div style="width:40px;"></div>
        </div>
        <div id="chatBox"></div>
        <div style="padding:20px; max-width:900px; margin:0 auto; width:100%;">
            <div style="display:flex; gap:10px; background:var(--input-bg); padding:8px; border-radius:30px; border:1px solid var(--border); align-items:center;">
                <input type="text" id="uInput" placeholder="Groq ile ışık hızında mesajlaş..." style="flex:1; background:transparent; border:none; color:white; outline:none; padding:10px 15px; font-size:1rem;">
                <button class="btn" id="sendBtn" style="background:var(--accent); color:white; width:45px; height:45px; border-radius:50%;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let curUser = null, curSid = null, allSess = [];

        // DOM Elements
        const chatBox = document.getElementById('chatBox');
        const uInput = document.getElementById('uInput');
        const sessList = document.getElementById('sessionList');

        // Event Listeners (Sağlam Bağlantı) [cite: 2025-12-04]
        document.getElementById('sendBtn').addEventListener('click', handleSend);
        document.getElementById('newChatBtn').addEventListener('click', handleNewChat);
        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());
        document.getElementById('menuBtn').addEventListener('click', toggleMenu);
        document.getElementById('overlay').addEventListener('click', toggleMenu);
        uInput.addEventListener('keypress', e => { if(e.key === 'Enter') handleSend(); });

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        auth.onAuthStateChanged(user => {
            if(user) { 
                curUser = user; 
                document.getElementById('uName').innerText = `Merhaba, ${user.displayName.split(' ')[0]}`;
                initData(); 
            } else { 
                auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); 
            }
        });

        async function initData() {
            db.collection('users').doc(curUser.uid).collection('sessions').orderBy('timestamp', 'desc').onSnapshot(snap => {
                allSess = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderSessions();
                if(!curSid && allSess.length > 0) loadSess(allSess[0].id);
                else if(!curSid) handleNewChat();
            });
        }

        async function handleNewChat() { [cite: 2025-12-04]
            const d = await db.collection('users').doc(curUser.uid).collection('sessions').add({
                title: "Yeni Sohbet", messages: [], timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            curSid = d.id;
            loadSess(d.id);
        }

        function loadSess(id) {
            curSid = id;
            const s = allSess.find(x => x.id === id);
            chatBox.innerHTML = "";
            if(s?.messages) s.messages.forEach(m => addMsg(m.role, m.content));
            renderSessions();
        }

        async function handleSend() { [cite: 2025-12-04]
            const val = uInput.value.trim();
            if(!val || !curSid) return;
            
            addMsg('user', val);
            uInput.value = "";
            
            try {
                // GroqCloud API Worker üzerinden çağrılıyor [cite: 2025-12-04]
                const r = await fetch("https://neura.ozcanarel25.workers.dev", {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ 
                        messages: [{role:"system", content:"Adın Neura AI. Groq altyapısını kullanıyorsun."}, {role:"user", content:val}],
                        model: "llama-3.3-70b-versatile" // Groq modelini burada belirtebilirsin [cite: 2025-12-04]
                    })
                });
                const d = await r.json();
                const ai = d.choices[0].message.content;
                
                const s = allSess.find(x => x.id === curSid);
                await db.collection('users').doc(curUser.uid).collection('sessions').doc(curSid).update({
                    messages: [...(s.messages || []), {role:"user", content:val}, {role:"assistant", content:ai}],
                    title: (s.messages?.length || 0) === 0 ? val.substring(0,20) : s.title
                });
                addMsg('assistant', ai);
                playVoice(ai);
            } catch(e) { console.error("Hata:", e); }
        }

        function addMsg(role, txt) {
            const d = document.createElement('div');
            d.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            d.innerHTML = role === 'assistant' ? marked.parse(txt) : txt;
            chatBox.appendChild(d);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderSessions() {
            sessList.innerHTML = "";
            allSess.forEach(s => {
                const d = document.createElement('div');
                d.style = `padding:12px; border-radius:10px; cursor:pointer; font-size:0.85rem; border:1px solid ${s.id === curSid ? 'var(--accent)' : 'transparent'}; background:${s.id === curSid ? 'rgba(59,130,246,0.1)' : 'var(--input-bg)'}`;
                d.innerText = s.title;
                d.onclick = () => { loadSess(s.id); if(window.innerWidth < 1024) toggleMenu(); };
                sessList.appendChild(d);
            });
        }

        function playVoice(t) {
            const v = document.getElementById('vSel').value;
            if(v === 'none') return; [cite: 2025-12-04]
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'tr-TR'; u.pitch = (v === 'f' ? 1.2 : 0.8);
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
