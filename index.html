<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI | Sessions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel); transition: 0.4s; z-index: 1000; border-right: 1px solid #1e293b; padding: 20px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; box-shadow: 20px 0 50px #000; }
        
        .new-chat-btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .new-chat-btn:hover { filter: brightness(1.1); }

        .session-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem; border: 1px solid transparent; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-item:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .session-item.active { border-color: var(--accent); background: var(--accent); color: white; }

        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1100; background: var(--panel); border: 1px solid #1e293b; color: white; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; }

        /* Main UI */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; }
        #chatBox { flex: 1; overflow-y: auto; padding: 90px 20px 30px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 14px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }

        /* Input */
        .input-area { padding: 25px; background: var(--bg); }
        .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; background: #111827; padding: 8px; border-radius: 15px; border: 1px solid #1e293b; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        button#sendBtn { background: var(--accent); border: none; color: white; padding: 0 20px; border-radius: 10px; cursor: pointer; }

        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; }
        .overlay.active { display:block; }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fas fa-plus"></i> Yeni Sohbet
        </button>
        
        <h3 style="font-size:0.7rem; color:#64748b; text-transform:uppercase;">Geçmiş Sohbetler</h3>
        <div id="sessionList" style="flex:1; overflow-y:auto;"></div>

        <button onclick="clearAllData()" style="background:#7f1d1d; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer; font-size:0.8rem; margin-top:10px;">
            <i class="fas fa-trash"></i> Tüm Veriyi Sil
        </button>
    </div>

    <div class="main-content">
        <div id="chatBox"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
                <button onclick="sendMessage()" id="sendBtn">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";
        const STORAGE_KEY = "neura_ai_sessions_v1";
        
        // sessions: [{id: 123, title: "Sohbet 1", messages: [...]}, ...]
        let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentSessionId = localStorage.getItem("neura_current_id") || null;

        const SYSTEM_PROMPT = { role: "system", content: "Adın Neura AI. Geliştiricin Arel." };

        window.onload = () => {
            if (sessions.length === 0) createNewChat();
            else loadSession(currentSessionId || sessions[0].id);
            renderSessionList();
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        function createNewChat() {
            const newId = Date.now().toString();
            const newSession = {
                id: newId,
                title: "Yeni Sohbet",
                messages: []
            };
            sessions.unshift(newSession); // En başa ekle
            saveAndRefresh(newId);
            toggleMenu();
        }

        function loadSession(id) {
            currentSessionId = id;
            localStorage.setItem("neura_current_id", id);
            const session = sessions.find(s => s.id === id);
            
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = "";
            
            if (session.messages.length === 0) {
                renderMessage('assistant', "Yeni bir sohbet başladı. Ben Neura AI.");
            } else {
                session.messages.forEach(m => renderMessage(m.role, m.content));
            }
            renderSessionList();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const session = sessions.find(s => s.id === currentSessionId);
            
            // İlk mesajsa sohbet başlığını güncelle
            if (session.messages.length === 0) {
                session.title = text.substring(0, 20) + (text.length > 20 ? "..." : "");
            }

            addMessageToSession('user', text);
            input.value = "";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [SYSTEM_PROMPT, ...session.messages] })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                addMessageToSession('assistant', aiMsg);
            } catch (err) {
                renderMessage('assistant', "Bağlantı hatası.");
            }
        }

        function addMessageToSession(role, content) {
            const session = sessions.find(s => s.id === currentSessionId);
            session.messages.push({ role, content });
            saveAndRefresh(currentSessionId);
            renderMessage(role, content);
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = "";
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                div.innerHTML = `<i class="far fa-comment-alt"></i> ${s.title}`;
                div.onclick = () => { loadSession(s.id); toggleMenu(); };
                list.appendChild(div);
            });
        }

        function saveAndRefresh(id) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
            loadSession(id);
        }

        function clearAllData() {
            if(confirm("Tüm geçmiş silinecek!")) {
                localStorage.clear();
                location.reload();
            }
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
