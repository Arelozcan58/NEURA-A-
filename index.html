<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NEURA-A- | Güvenli AI</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #chat { width: 90%; max-width: 600px; height: 70vh; overflow-y: auto; border: 1px solid #1e293b; padding: 20px; margin: 20px 0; }
        .input-box { display: flex; gap: 10px; width: 90%; max-width: 600px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: white; }
        button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>NEURA-A-</h1>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
        <button onclick="askAI()">Gönder</button>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev"; // Kendi URL'inle değiştir
        let history = [];

        async function askAI() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            // Ekrana kullanıcı mesajını bas
            render('Kullanıcı', text);
            history.push({ role: "user", content: text });
            input.value = "";

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    body: JSON.stringify({ messages: history })
                });
                const data = await res.json();
                const aiMsg = data.choices[0].message.content;

                render('AI', aiMsg);
                history.push({ role: "assistant", content: aiMsg });
            } catch (e) {
                render('Sistem', 'Hata oluştu, bağlantıyı kontrol et.');
            }
        }

        function render(sender, msg) {
            const chat = document.getElementById('chat');
            chat.innerHTML += `<p><strong>${sender}:</strong> ${msg}</p>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
