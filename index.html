<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI | Kalıcı Bellek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar & Menu */
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel); transition: 0.4s; z-index: 1000; border-right: 1px solid #1e293b; padding: 25px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; box-shadow: 20px 0 50px #000; }
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1100; background: var(--accent); border: none; color: white; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; }

        /* Chat UI */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; }
        #chatBox { flex: 1; overflow-y: auto; padding: 90px 20px 30px; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 15px 20px; border-radius: 18px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }

        /* Input */
        .input-area { padding: 25px; background: var(--bg); }
        .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; background: #111827; padding: 8px; border-radius: 15px; border: 1px solid #1e293b; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        button#sendBtn { background: var(--accent); border: none; color: white; padding: 0 20px; border-radius: 10px; cursor: pointer; }

        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; }
        .overlay.active { display:block; }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <h2 style="color:var(--accent)">NEURA CORE</h2>
        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:20px;">
            <h3 style="font-size:0.7rem; color:#64748b; margin:0">Geliştirici</h3>
            <p style="margin:5px 0 0 0; font-weight:bold">Arel</p>
        </div>
        <div id="historyList" style="flex:1; overflow-y:auto">
            <h3 style="font-size:0.7rem; color:#64748b;">Son Mesajlar</h3>
            </div>
        <button onclick="clearChat()" style="background:#7f1d1d; color:white; border:none; padding:12px; border-radius:10px; cursor:pointer; font-weight:bold;">BELLEĞİ SIFIRLA</button>
    </div>

    <div class="main-content">
        <div id="chatBox"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
                <button onclick="sendMessage()" id="sendBtn">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";
        // Sabit anahtar ismi: neura_permanent_v1 (Değişmeyecek)
        const DB_KEY = "neura_permanent_v1";
        let chatHistory = JSON.parse(localStorage.getItem(DB_KEY)) || [];

        const SYSTEM_PROMPT = { 
            role: "system", 
            content: "Adın Neura AI. Geliştiricin Arel. Sen Arel'in özel projesisin." 
        };

        // Sayfa yüklendiğinde eski mesajları ekrana basar
        window.onload = () => {
            loadMessages();
            updateSidebar();
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        function loadMessages() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = ""; // Temizle
            if (chatHistory.length === 0) {
                renderMessage('assistant', "Sistem hazır. Ben Neura AI, geliştiricim Arel'in emrindeyim.");
            } else {
                chatHistory.forEach(m => renderMessage(m.role, m.content));
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = "";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [SYSTEM_PROMPT, ...chatHistory] })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                
                addMessage('assistant', aiMsg);
            } catch (err) {
                renderMessage('assistant', "Hata: Mesaj iletilemedi.");
            }
        }

        function addMessage(role, content) {
            chatHistory.push({ role, content });
            // Her mesaj eklendiğinde localStorage'a kaydet
            localStorage.setItem(DB_KEY, JSON.stringify(chatHistory));
            renderMessage(role, content);
            updateSidebar();
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateSidebar() {
            const list = document.getElementById('historyList');
            const userMsgs = chatHistory.filter(m => m.role === 'user');
            // Sadece son 3 kullanıcı mesajını özet olarak göster
            const summary = userMsgs.slice(-3).map(m => `<div style="font-size:0.8rem; background:rgba(255,255,255,0.05); padding:8px; margin-bottom:5px; border-radius:5px">${m.content.substring(0,25)}...</div>`).join("");
            list.innerHTML = `<h3 style="font-size:0.7rem; color:#64748b;">Son Konuşmalar</h3>` + summary;
        }

        function clearChat() {
            if(confirm("Tüm sohbet geçmişi silinecek. Onaylıyor musun?")) {
                localStorage.removeItem(DB_KEY);
                location.reload();
            }
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
