<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURA-A- | AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl flex flex-col h-[90vh]">
        <header class="py-4 border-b border-slate-700 mb-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">NEURA-A-</h1>
            <button onclick="clearChat()" class="text-xs text-red-400 border border-red-400 px-2 py-1 rounded hover:bg-red-400 hover:text-white transition">Belleği Sil</button>
        </header>

        <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 p-2 scroll-smooth"></div>

        <div class="mt-4 flex gap-2">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500">
            <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">Gönder</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
