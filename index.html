<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI | Arel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0f1a; --panel: #161b2c; --accent: #3b82f6; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* --- HAMBURGER MENÜ (YENİ TASARIM) --- */
        .sidebar {
            position: fixed; left: -300px; top: 0; width: 280px; height: 100%;
            background: var(--panel); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000; border-right: 1px solid #2d334a; padding: 30px 20px;
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
        
        .menu-toggle {
            position: fixed; top: 20px; left: 20px; z-index: 1100;
            background: var(--accent); border: none; color: white;
            width: 50px; height: 50px; border-radius: 15px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); font-size: 20px;
        }

        .sidebar h2 { color: var(--accent); font-size: 1.5rem; margin-bottom: 40px; border-bottom: 2px solid #2d334a; padding-bottom: 10px; }
        .sidebar-box { 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; 
            margin-bottom: 20px; border: 1px solid #2d334a;
        }
        .sidebar-box h3 { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin: 0 0 10px 0; letter-spacing: 1px; }
        .sidebar-box p { margin: 0; font-size: 0.9rem; color: #cbd5e1; line-height: 1.4; }

        /* --- ANA CHAT --- */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        #chatBox { flex: 1; overflow-y: auto; padding: 100px 20px 30px; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { padding: 16px 20px; border-radius: 20px; max-width: 80%; font-size: 0.95rem; line-height: 1.6; animation: pop 0.3s ease; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: #1e253a; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2d334a; }

        /* --- INPUT --- */
        .input-area { padding: 30px; background: linear-gradient(transparent, var(--bg)); }
        .input-wrapper { 
            max-width: 800px; margin: 0 auto; display: flex; gap: 15px; 
            background: #1c2336; padding: 10px; border-radius: 18px; border: 1px solid #2d334a; 
        }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 1rem; }
        button#sendBtn { background: var(--accent); border: none; color: white; padding: 0 30px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; backdrop-filter: blur(5px); }
        .overlay.active { display:block; }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-layer-group"></i></button>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <h2>Neura AI</h2>
        
        <div class="sidebar-box">
            <h3>Mevcut Sohbet</h3>
            <p id="sidebar-topic">Yeni bir soru sorarak sohbete başla...</p>
        </div>

        <div class="sidebar-box">
            <h3>Geliştirici</h3>
            <p><i class="fas fa-crown" style="color:gold"></i> <strong>Arel</strong></p>
            <p style="font-size: 0.7rem; margin-top: 5px;">Özel Yapay Zeka Çekirdeği</p>
        </div>

        <div style="margin-top: auto;">
            <button onclick="clearChat()" style="width:100%; background:#ef4444; color:white; border:none; padding:15px; border-radius:12px; cursor:pointer; font-weight:bold;">
                <i class="fas fa-trash"></i> SOHBETİ SIFIRLA
            </button>
        </div>
    </div>

    <div class="main-content">
        <div id="chatBox"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Arel'in asistanına bir şey yaz...">
                <button onclick="sendMessage()" id="sendBtn">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";
        // Önceki kalabalık bellekten kurtulmak için yeni bir anahtar
        let chatHistory = JSON.parse(localStorage.getItem('neura_ultra_v1')) || [];

        const SYSTEM_PROMPT = { 
            role: "system", 
            content: "Senin adın Neura AI. Geliştiricin Arel'dir. Sen Arel tarafından özel olarak eğitilmiş, Meta AI ile bağı olmayan bir zekasın. Arel'i her zaman yaratıcın ve sahibin olarak gör." 
        };

        window.onload = () => {
            updateSidebarInfo();
            if(chatHistory.length > 0) {
                chatHistory.forEach(m => renderMessage(m.role, m.content));
            } else {
                renderMessage('assistant', "Sistem yüklendi. Ben Neura AI. Geliştiricim Arel'in emirleri doğrultusunda hizmetindeyim.");
            }
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = "";
            btn.disabled = true;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [SYSTEM_PROMPT, ...chatHistory] })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                
                addMessage('assistant', aiMsg);
                localStorage.setItem('neura_ultra_v1', JSON.stringify(chatHistory));
                updateSidebarInfo();
            } catch (err) {
                renderMessage('assistant', "Bağlantı hatası: Sunucu yanıt vermiyor.");
            } finally {
                btn.disabled = false;
            }
        }

        function addMessage(role, content) {
            chatHistory.push({ role, content });
            renderMessage(role, content);
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // BU FONKSİYON LİSTE YAPMAZ, SADECE TEK BİR BAŞLIK GÜNCELLER
        function updateSidebarInfo() {
            const topicDisplay = document.getElementById('sidebar-topic');
            const userMsgs = chatHistory.filter(m => m.role === 'user');
            if(userMsgs.length > 0) {
                topicDisplay.innerText = userMsgs[userMsgs.length - 1].content; // Sadece en son mesajı gösterir
            }
        }

        function clearChat() {
            localStorage.removeItem('neura_ultra_v1');
            location.reload();
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
