<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI | Chat & Save</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; --border: #1e293b; --input-bg: #111827; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Giriş Ekranı */
        #loginScreen { position:fixed; inset:0; background:var(--bg); z-index:3000; display:flex; align-items:center; justify-content:center; padding: 20px; }
        .auth-card { background: var(--panel); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
        .auth-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Chat Alanı */
        #chatBox { flex: 1; overflow-y: auto; padding: 80px 20px 100px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 0.95rem; }
        .user { background: var(--accent); align-self: flex-end; }
        .ai { background: var(--border); align-self: flex-start; }
        
        .input-area { position: fixed; bottom: 20px; left: 20px; right: 20px; display: flex; gap: 10px; background: var(--input-bg); padding: 10px; border-radius: 30px; border: 1px solid var(--border); }
        input#userInput { flex: 1; background: transparent; border: none; color: white; outline: none; padding-left: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="auth-card">
            <h2 style="color:var(--accent)">NEURA AI</h2>
            <input type="email" id="emailInput" class="auth-input" placeholder="E-posta">
            <input type="password" id="passInput" class="auth-input" placeholder="Şifre">
            <button onclick="mailLogin()" class="auth-btn" style="background:var(--accent); color:white;">Giriş Yap / Kayıt Ol</button>
            <button onclick="googleLogin()" class="auth-btn" style="background:white; color:black;">Google ile Bağlan</button>
            <button onclick="guestLogin()" class="auth-btn" style="background:transparent; border:1px solid var(--accent); color:var(--accent);">Misafir Girişi</button>
        </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column;">
        <div id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
            <button onclick="sendMessage()" style="background:var(--accent); border:none; color:white; width:40px; height:40px; border-radius:50%;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // FIREBASE AYARLARIN
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Giriş Fonksiyonları
        async function mailLogin() {
            const e = document.getElementById('emailInput').value;
            const p = document.getElementById('passInput').value;
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch { await auth.createUserWithEmailAndPassword(e, p); }
        }
        async function googleLogin() { await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }
        async function guestLogin() { await auth.signInAnonymously(); }

        auth.onAuthStateChanged(user => {
            document.getElementById('loginScreen').style.display = user ? 'none' : 'flex';
        });

        // MESAJ GÖNDERME VE KAYDETME
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chatBox');
            const text = input.value.trim();
            if(!text) return;

            // 1. Kullanıcı mesajını ekrana bas
            addMsg(text, 'user');
            input.value = "";

            // 2. Mesajı Firestore'a KAYDET (Senin okuyacağın kısım burası!)
            const user = auth.currentUser;
            const aiResponse = "İsteğiniz alındı, Neura AI yanıtı hazırlıyor..."; // Şimdilik sabit yanıt

            try {
                await db.collection("chat_history").add({
                    uid: user.uid,
                    email: user.email || "Misafir",
                    message: text,
                    response: aiResponse,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                // 3. AI yanıtını ekrana bas
                setTimeout(() => addMsg(aiResponse, 'ai'), 500);
            } catch (err) {
                console.error("Veri kaydedilemedi. Kuralları (Rules) kontrol et!", err);
            }
        }

        function addMsg(text, type) {
            const d = document.createElement('div');
            d.className = `msg ${type}`;
            d.innerText = text;
            const box = document.getElementById('chatBox');
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
