<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI | Repair Mode</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; --border: #1e293b; --input-bg: #111827; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel); transition: 0.3s; z-index: 2000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        @media (min-width: 1024px) { .sidebar { position: relative; left: 0; } .menu-toggle { display: none; } }
        .sidebar.active { left: 0; }
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        #chatBox { flex: 1; overflow-y: auto; padding: 70px 20px 20px; display: flex; flex-direction: column; gap: 15px; }
        .top-bar { position: absolute; top: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(5, 7, 10, 0.8); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .user { background: var(--accent); align-self: flex-end; color: white; }
        .ai { background: #1e293b; align-self: flex-start; border: 1px solid var(--border); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; }
        .overlay.active { display: block; }
        .btn { cursor: pointer; border: none; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="window.toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div id="uName" style="font-weight:bold; color:var(--accent); margin-bottom:20px;">Bağlanıyor...</div>
        <button class="btn" onclick="window.handleNewChat()" style="width:100%; background:var(--accent); color:white; padding:12px; border-radius:12px; font-weight:bold;">+ Yeni Sohbet</button>
        <div id="sessionList" style="flex:1; overflow-y:auto; margin-top:20px; display:flex; flex-direction:column; gap:8px;"></div>
        <div style="padding-top:15px; border-top:1px solid var(--border);">
            <select id="vSel" style="width:100%; padding:10px; border-radius:10px; background:var(--input-bg); color:white; border:1px solid var(--border); margin-bottom:10px;">
                <option value="none">🔇 Ses Kapalı</option>
                <option value="f" selected>👩 Kadın Sesi</option>
                <option value="m">👨 Erkek Sesi</option>
            </select>
            <button class="btn" onclick="window.handleLogout()" style="width:100%; background:#ef4444; color:white; padding:10px; border-radius:10px; font-weight:bold;">Hesaptan Çık</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle btn" onclick="window.toggleMenu()" style="background:none; color:white; font-size:1.3rem;"><i class="fas fa-bars"></i></button>
            <span style="font-weight:bold;">NEURA AI</span>
            <div style="width:40px;"></div>
        </div>
        <div id="chatBox"></div>
        <div style="padding:20px;">
            <div style="display:flex; gap:10px; background:var(--input-bg); padding:8px; border-radius:30px; border:1px solid var(--border); align-items:center;">
                <input type="text" id="uInput" placeholder="Mesaj yaz..." style="flex:1; background:transparent; border:none; color:white; outline:none; padding:10px 15px;">
                <button class="btn" onclick="window.handleSend()" style="background:var(--accent); color:white; width:45px; height:45px; border-radius:50%;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let curUser = null, curSid = null, allSess = [];

        // Fonksiyonları Global Yapalım (Butonların her zaman erişebilmesi için)
        window.toggleMenu = () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        };

        window.handleLogout = () => auth.signOut().then(() => window.location.reload());

        window.handleNewChat = async () => {
            if(!curUser) return;
            const d = await db.collection('users').doc(curUser.uid).collection('sessions').add({
                title: "Yeni Sohbet", messages: [], timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            curSid = d.id;
            console.log("Yeni Sohbet Açıldı:", curSid);
        };

        window.handleSend = async () => {
            const input = document.getElementById('uInput');
            const val = input.value.trim();
            if(!val) return;
            
            // Eğer aktif sohbet yoksa önce oluştur
            if(!curSid) {
                await window.handleNewChat();
            }

            addMsg('user', val);
            input.value = "";
            
            try {
                const r = await fetch("https://neura.ozcanarel25.workers.dev", {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ messages: [{role:"user", content:val}] })
                });
                const d = await r.json();
                const ai = d.choices[0].message.content;
                
                // Firestore Güncelleme
                const sRef = db.collection('users').doc(curUser.uid).collection('sessions').doc(curSid);
                const sDoc = await sRef.get();
                const oldMsgs = sDoc.data()?.messages || [];
                
                await sRef.update({
                    messages: [...oldMsgs, {role:"user", content:val}, {role:"assistant", content:ai}],
                    title: oldMsgs.length === 0 ? val.substring(0,20) : sDoc.data().title
                });
                
                addMsg('assistant', ai);
                playVoice(ai);
            } catch(e) { 
                console.error("Gönderme Hatası:", e);
                addMsg('ai', "Hata: Mesaj iletilemedi. Worker çalışıyor mu?");
            }
        };

        function addMsg(role, txt) {
            const d = document.createElement('div');
            d.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            d.innerHTML = role === 'assistant' ? marked.parse(txt) : txt;
            document.getElementById('chatBox').appendChild(d);
            document.getElementById('chatBox').scrollTop = chatBox.scrollHeight;
        }

        function playVoice(t) {
            const v = document.getElementById('vSel').value;
            if(v === 'none') return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'tr-TR'; u.pitch = (v === 'f' ? 1.2 : 0.8);
            window.speechSynthesis.speak(u);
        }

        auth.onAuthStateChanged(user => {
            if(user) { 
                curUser = user; 
                document.getElementById('uName').innerText = user.displayName;
                db.collection('users').doc(user.uid).collection('sessions').orderBy('timestamp', 'desc').onSnapshot(snap => {
                    allSess = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const l = document.getElementById('sessionList');
                    l.innerHTML = "";
                    allSess.forEach(s => {
                        const d = document.createElement('div');
                        d.style = `padding:10px; border-radius:8px; cursor:pointer; background:${s.id === curSid ? 'rgba(59,130,246,0.2)' : 'var(--input-bg)'}`;
                        d.innerText = s.title;
                        d.onclick = () => { curSid = s.id; loadChat(s); };
                        l.appendChild(d);
                    });
                });
            } else { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        });

        function loadChat(s) {
            document.getElementById('chatBox').innerHTML = "";
            if(s.messages) s.messages.forEach(m => addMsg(m.role, m.content));
        }

        document.getElementById('uInput').addEventListener('keypress', e => { if(e.key === 'Enter') window.handleSend(); });
    </script>
</body>
</html>
