<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI | Privacy & Voice</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root { 
            --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; 
            --msg-ai: #1e293b; --border: #1e293b; --input-bg: #111827; --radius: 16px;
        }
        body.light-mode {
            --bg: #f8fafc; --panel: #ffffff; --accent: #2563eb; --text: #1e293b;
            --msg-ai: #f1f5f9; --border: #e2e8f0; --input-bg: #ffffff;
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* Sidebar & Menu */
        .sidebar { position: fixed; left: -100%; top: 0; width: 85%; max-width: 300px; height: 100%; background: var(--panel); transition: 0.4s; z-index: 2000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        
        /* Sidebar Linkleri İçin */
        .session-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 5px; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .session-item:hover { background: rgba(59, 130, 246, 0.1); }

        /* Login Ekranı */
        #loginScreen { position:fixed; inset:0; background:var(--bg); z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 20px; text-align: center; }
        .auth-card { background: var(--panel); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 400px; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
        .auth-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .google-btn { background: #fff; color: #000; }
        .mail-btn { background: var(--accent); color: white; }
        .guest-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        #chatBox { flex: 1; overflow-y: auto; padding: 80px 20px 30px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { padding: 14px 18px; border-radius: var(--radius); max-width: 85%; font-size: 0.95rem; animation: fadeIn 0.3s; }
        .user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: var(--msg-ai); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        .top-bar { position: absolute; top: 0; width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(5, 7, 10, 0.7); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid var(--border); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="dark-mode">

    <div id="loginScreen">
        <div class="auth-card">
            <h1 style="color:var(--accent); margin-bottom: 20px; letter-spacing: 5px;">NEURA</h1>
            
            <input type="email" id="emailInput" class="auth-input" placeholder="E-posta">
            <input type="password" id="passInput" class="auth-input" placeholder="Şifre">
            <button onclick="mailLogin()" class="auth-btn mail-btn">Mail ile Giriş Yap</button>
            
            <div style="margin: 20px 0; color: #64748b; font-size: 0.8rem;">VEYA</div>
            
            <button onclick="googleLogin()" class="auth-btn google-btn"><i class="fab fa-google"></i> Google ile Başla</button>
            <button onclick="guestLogin()" class="auth-btn guest-btn">Misafir Olarak Dene</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div id="userInfo" style="margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid var(--border); font-weight:bold; color:var(--accent);"></div>
        
        <div id="sessionList" style="flex:1; overflow-y:auto;">
            </div>

        <div style="margin-top:auto; padding-top:20px;">
            <button onclick="auth.signOut()" style="width:100%; background:#ef4444; color:white; border:none; padding:12px; border-radius:12px; cursor:pointer; font-weight:bold;">Çıkış Yap</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button id="menuBtn" style="background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer;">
                <i class="fas fa-bars"></i>
            </button>
            <span style="font-weight:bold; color:var(--accent);">NEURA AI</span>
            <button onclick="toggleTheme()" style="background:none; border:none; color:var(--text); cursor:pointer;"><i class="fas fa-moon"></i></button>
        </div>

        <div id="chatBox"></div>

        <div style="padding:20px; width:100%;">
            <div style="display:flex; gap:10px; background:var(--input-bg); padding:10px; border-radius:30px; border:1px solid var(--border); align-items:center;">
                <input type="text" id="userInput" placeholder="Mesajınızı yazın..." style="flex:1; background:transparent; border:none; color:var(--text); outline:none; padding-left:15px;">
                <button onclick="sendMessage()" style="background:var(--accent); border:none; color:white; width:45px; height:45px; border-radius:50%; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Yapılandırması
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- AUTH SİSTEMİ ---

        // 1. Google Giriş
        async function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                // WebView için Redirect daha güvenlidir
                await auth.signInWithRedirect(provider);
            } catch (e) { alert("Google Giriş Hatası: " + e.message); }
        }

        // 2. Mail ile Giriş/Kayıt
        async function mailLogin() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            if(!email || !pass) return alert("Bilgileri doldurun.");
            
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (e) {
                try {
                    await auth.createUserWithEmailAndPassword(email, pass);
                    alert("Hesap oluşturuldu ve giriş yapıldı!");
                } catch (err) { alert("Hata: " + err.message); }
            }
        }

        // 3. Misafir Girişi
        async function guestLogin() {
            try {
                await auth.signInAnonymously();
            } catch (e) { alert("Misafir girişi başarısız."); }
        }

        // --- MENÜ KONTROLÜ (HAMBURGER SORUNU ÇÖZÜMÜ) ---
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');

        menuBtn.onclick = (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('active');
        };

        // Menü dışına tıklandığında veya menü içinden bir şeye tıklandığında menüyü kapat
        document.onclick = (e) => {
            if (sidebar.classList.contains('active') && !sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('active');
            }
        };

        // Oturum Kontrolü
        auth.onAuthStateChanged(user => {
            const loginScreen = document.getElementById('loginScreen');
            if (user) {
                loginScreen.style.display = 'none';
                document.getElementById('userInfo').innerText = user.isAnonymous ? "Misafir Kullanıcı" : user.email;
            } else {
                loginScreen.style.display = 'flex';
            }
        });

        // Tema ve Diğer Fonksiyonlar (Aynı Kalabilir)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chatBox');
            if(!input.value) return;
            
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerText = input.value;
            box.appendChild(div);
            input.value = "";
            box.scrollTop = box.scrollHeight;
            
            // AI Yanıt Simülasyonu
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'msg ai';
                aiDiv.innerText = "Neura AI şu an sizi dinliyor...";
                box.appendChild(aiDiv);
                box.scrollTop = box.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
