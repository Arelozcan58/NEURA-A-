<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI | Arel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Hamburger Menü (Sidebar) */
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 260px;
            height: 100%;
            background: var(--panel-color);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar.active {
            left: 0;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1100;
            background: var(--panel-color);
            border: 1px solid #334155;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-toggle:hover { background: var(--accent-color); }

        /* Sidebar İçerik */
        .sidebar h2 { font-size: 1.2rem; color: var(--accent-color); margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .sidebar h3 { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; margin-top: 20px; }
        .history-list { flex: 1; overflow-y: auto; margin-top: 10px; }
        .history-item { 
            padding: 12px; 
            background: rgba(15, 23, 42, 0.5); 
            border-radius: 6px; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
        }
        .history-item:hover { border-color: var(--accent-color); background: #1e293b; }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            transition: margin-left 0.4s;
        }

        header {
            text-align: center;
            padding: 25px;
            border-bottom: 1px solid #1e293b;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg { padding: 15px 20px; border-radius: 15px; max-width: 75%; line-height: 1.6; position: relative; animation: slideUp 0.3s ease; }
        .user { background: var(--accent-color); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: var(--panel-color); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }

        /* Giriş Alanı */
        .input-container {
            padding: 30px;
            background: linear-gradient(transparent, var(--bg-color));
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            background: var(--panel-color);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            outline: none;
            font-size: 1rem;
        }

        button#sendBtn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button#sendBtn:hover { transform: scale(1.05); }

        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; }
        .overlay.active { display:block; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <h2><i class="fas fa-robot"></i> Neura AI</h2>
        <h3>Sohbet Geçmişi</h3>
        <div id="historyList" class="history-list"></div>
        
        <h3>Kontrol Paneli</h3>
        <div class="history-item" onclick="clearChat()"><i class="fas fa-trash"></i> Belleği Temizle</div>
        <div class="history-item"><i class="fas fa-user-shield"></i> Geliştirici: Arel</div>
    </div>

    <div class="main-content">
        <header>
            <h1 style="margin:0; font-size: 1.5rem; letter-spacing: 2px;">NEURA-A-</h1>
            <span style="font-size: 0.8rem; color: var(--accent-color);">Cloud-Powered Intelligence</span>
        </header>

        <div id="chatBox"></div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Neura'ya bir şeyler sor...">
                <button onclick="sendMessage()" id="sendBtn">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";
        let chatHistory = JSON.parse(localStorage.getItem('neura_final_v1')) || [];

        // KİMLİK ÖĞRETME: Bu talimat her mesajda AI'ya gönderilir
        const IDENTITY = { 
            role: "system", 
            content: "Senin adın Neura AI. Geliştiricin ve yaratıcın Arel'dir. Sana kim olduğun veya kim tarafından yapıldığın sorulursa kesinlikle 'Ben Neura AI, geliştiricim Arel'dir' cevabını ver. Meta AI veya başka bir kurumla bağlantın olduğunu söyleme." 
        };

        window.onload = () => {
            updateSidebar();
            if(chatHistory.length > 0) {
                chatHistory.forEach(m => renderMessage(m.role, m.content));
            } else {
                renderMessage('assistant', "Merhaba! Ben Neura AI. Arel tarafından geliştirildim. Bugün sana nasıl yardımcı olabilirim?");
            }
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = "";
            btn.disabled = true;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [IDENTITY, ...chatHistory] })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                
                addMessage('assistant', aiMsg);
                localStorage.setItem('neura_final_v1', JSON.stringify(chatHistory));
                updateSidebar();
            } catch (err) {
                renderMessage('assistant', "Bağlantı kesildi. Lütfen sayfayı yenileyin.");
            } finally {
                btn.disabled = false;
            }
        }

        function addMessage(role, content) {
            chatHistory.push({ role, content });
            renderMessage(role, content);
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateSidebar() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            chatHistory.filter(m => m.role === 'user').slice(-6).reverse().forEach(m => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = m.content;
                list.appendChild(item);
            });
        }

        function clearChat() {
            localStorage.removeItem('neura_final_v1');
            location.reload();
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
