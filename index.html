<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI | Privacy & Voice</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root { 
            --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; 
            --msg-ai: #1e293b; --border: #1e293b; --input-bg: #111827; --radius: 16px;
        }
        body.light-mode {
            --bg: #f8fafc; --panel: #ffffff; --accent: #2563eb; --text: #1e293b;
            --msg-ai: #f1f5f9; --border: #e2e8f0; --input-bg: #ffffff;
        }
        body.incognito-mode {
            --bg: #1a1a1a; --panel: #2d2d2d; --accent: #9ca3af; --text: #ffffff;
            --msg-ai: #404040; --border: #525252; --input-bg: #262626;
        }

        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        .sidebar { position: fixed; left: -100%; top: 0; width: 85%; max-width: 300px; height: 100%; background: var(--panel); transition: 0.4s; z-index: 2000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        
        @media (min-width: 1024px) { .sidebar { position: relative; left: 0; width: 300px; } .menu-toggle { display: none; } }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chatBox { flex: 1; overflow-y: auto; padding: 80px 20px 30px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { padding: 14px 18px; border-radius: var(--radius); max-width: 85%; font-size: 0.95rem; position: relative; animation: fadeIn 0.3s; }
        .user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: var(--msg-ai); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        /* Sohbet Silme Butonu */
        .delete-btn { color: #ef4444; opacity: 0; transition: 0.3s; cursor: pointer; margin-left: 10px; }
        .session-item:hover .delete-btn { opacity: 1; }

        /* Üst Bar & Modlar */
        .top-bar { position: absolute; top: 0; width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(var(--bg), 0.7); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid var(--border); }
        .incognito-badge { display: none; background: #525252; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        body.incognito-mode .incognito-badge { display: inline-block; }

        /* Yazıyor... */
        .typing-indicator { display: none; padding: 10px 15px; background: var(--msg-ai); border-radius: 20px; width: fit-content; margin-bottom: 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="dark-mode">

    <div id="loginScreen" style="position:fixed; inset:0; background:var(--bg); z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1 style="color:var(--accent); font-size:3rem;">NEURA</h1>
        <button onclick="googleLogin()" style="background:var(--accent); color:white; padding:15px 40px; border-radius:50px; border:none; cursor:pointer;">GİRİŞ YAP</button>
    </div>

    <div class="sidebar" id="sidebar">
        <div id="userInfo" style="margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid var(--border);"></div>
        
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button onclick="createNewChat()" style="flex:1; background:var(--accent); color:white; border:none; padding:12px; border-radius:12px; font-weight:bold; cursor:pointer;">+ Yeni</button>
            <button onclick="toggleIncognito()" id="incognitoBtn" title="Gizli Sohbet" style="background:var(--msg-ai); color:var(--text); border:1px solid var(--border); padding:10px; border-radius:12px; cursor:pointer;"><i class="fas fa-user-secret"></i></button>
        </div>

        <div id="sessionList" style="flex:1; overflow-y:auto;"></div>
        
        <div style="margin-top:10px;">
            <select id="voiceSelect" style="width:100%; padding:8px; border-radius:8px; background:var(--msg-ai); color:var(--text); border:1px solid var(--border); margin-bottom:10px;">
                <option value="0">Ses 1 (Doğal)</option>
                <option value="1">Ses 2 (Dinamik)</option>
                <option value="2">Ses 3 (Derin)</option>
                <option value="3">Ses 4 (İnce)</option>
                <option value="4">Ses 5 (Robotik)</option>
            </select>
            <button onclick="auth.signOut()" style="width:100%; background:#ef4444; color:white; border:none; padding:10px; border-radius:10px;">Çıkış Yap</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button onclick="document.getElementById('sidebar').classList.toggle('active')" style="background:none; border:none; color:var(--text); font-size:1.2rem;"><i class="fas fa-bars"></i></button>
            <div>
                <span style="font-weight:bold; color:var(--accent);">NEURA AI</span>
                <span class="incognito-badge"><i class="fas fa-user-secret"></i> GİZLİ</span>
            </div>
            <button onclick="toggleTheme()" style="background:none; border:none; color:var(--text);"><i id="themeIcon" class="fas fa-moon"></i></button>
        </div>

        <div id="chatBox"></div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span style="font-size:0.8rem;">Neura düşünüyor...</span>
        </div>

        <div class="input-area" style="padding:20px;">
            <div style="display:flex; gap:10px; background:var(--input-bg); padding:10px; border-radius:25px; border:1px solid var(--border); align-items:center;">
                <input type="text" id="userInput" placeholder="Mesaj yazın..." style="flex:1; background:transparent; border:none; color:var(--text); outline:none;">
                <button onclick="sendMessage()" style="background:var(--accent); border:none; color:white; width:40px; height:40px; border-radius:50%; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";

        let currentUser = null, sessions = [], currentSessionId = null, isIncognito = false;

        // --- GİZLİ SOHBET FONKSİYONU ---
        function toggleIncognito() {
            isIncognito = !isIncognito;
            document.body.classList.toggle('incognito-mode', isIncognito);
            document.getElementById('incognitoBtn').style.color = isIncognito ? '#ef4444' : 'var(--text)';
            if(isIncognito) {
                currentSessionId = null;
                document.getElementById('chatBox').innerHTML = "<div class='msg ai'>Gizli sohbet modundasın. Bu konuşmalar buluta kaydedilmez.</div>";
            } else {
                syncDataFromCloud();
            }
        }

        // --- SOHBET SİLME FONKSİYONU ---
        async function deleteSession(id, e) {
            e.stopPropagation();
            if(!confirm("Bu sohbeti tamamen silmek istiyor musun?")) return;
            await db.collection('users').doc(currentUser.uid).collection('sessions').doc(id).delete();
            if(currentSessionId === id) currentSessionId = null;
            syncDataFromCloud();
        }

        // --- GELİŞMİŞ SES SİSTEMİ (5 SES) ---
        function speakText(text) {
            window.speechSynthesis.cancel(); // Önceki sesi durdur
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            const voiceIndex = document.getElementById('voiceSelect').value;
            const voices = synth.getVoices().filter(v => v.lang.includes('tr'));
            
            if(voices.length > 0) {
                utter.voice = voices[voiceIndex % voices.length];
                utter.pitch = [1, 1.2, 0.8, 1.5, 0.5][voiceIndex]; // Farklı karakterler
                utter.rate = [1, 1.1, 0.9, 1.2, 0.7][voiceIndex];
            }
            synth.speak(utter);
        }

        // --- DATA & UI ---
        auth.onAuthStateChanged(user => {
            if (user) { currentUser = user; document.getElementById('loginScreen').style.display = 'none'; syncDataFromCloud(); }
            else { document.getElementById('loginScreen').style.display = 'flex'; }
        });

        async function googleLogin() { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        async function syncDataFromCloud() {
            if(isIncognito) return;
            db.collection('users').doc(currentUser.uid).collection('sessions').orderBy('timestamp', 'desc').onSnapshot(snap => {
                sessions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderSessionList();
                if (!currentSessionId && sessions.length > 0) loadSession(sessions[0].id);
            });
        }

        async function createNewChat() {
            if(isIncognito) toggleIncognito();
            const doc = await db.collection('users').doc(currentUser.uid).collection('sessions').add({
                title: "Yeni Sohbet", messages: [], timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            currentSessionId = doc.id;
            loadSession(doc.id);
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            const box = document.getElementById('chatBox');
            box.innerHTML = "";
            if (session?.messages) session.messages.forEach(m => renderMessage(m.role, m.content));
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            renderMessage('user', text);
            input.value = "";
            document.getElementById('typingIndicator').style.display = 'block';

            let history = [];
            if(!isIncognito) {
                const session = sessions.find(s => s.id === currentSessionId);
                history = session?.messages || [];
            }

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{ role: "system", content: "Adın Neura AI." }, ...history, {role:"user", content:text}] })
                });
                const data = await res.json();
                const aiMsg = data.choices[0].message.content;

                if(!isIncognito && currentSessionId) {
                    await db.collection('users').doc(currentUser.uid).collection('sessions').doc(currentSessionId).update({
                        messages: [...history, { role: "user", content: text }, { role: "assistant", content: aiMsg }],
                        title: history.length === 0 ? text.substring(0, 20) : sessions.find(s=>s.id===currentSessionId).title
                    });
                }
                
                document.getElementById('typingIndicator').style.display = 'none';
                renderMessage('assistant', aiMsg);
                speakText(aiMsg);
            } catch (e) { document.getElementById('typingIndicator').style.display = 'none'; }
        }

        function renderMessage(role, content) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerHTML = role === 'assistant' ? marked.parse(content) : content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = "";
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = `session-item`;
                div.style = `padding:10px; background:${s.id === currentSessionId ? 'rgba(59,130,246,0.1)' : 'transparent'}; margin-bottom:5px; border-radius:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border:1px solid ${s.id === currentSessionId ? 'var(--accent)' : 'transparent'};`;
                div.innerHTML = `<span style="font-size:0.8rem; overflow:hidden;">${s.title}</span> <i class="fas fa-trash delete-btn" onclick="deleteSession('${s.id}', event)"></i>`;
                div.onclick = () => loadSession(s.id);
                list.appendChild(div);
            });
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
        window.speechSynthesis.onvoiceschanged = () => {}; // Sesleri hazırla
    </script>
</body>
</html>
