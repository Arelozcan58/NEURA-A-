<div style="margin-top:10px;">
    <label style="font-size: 0.75rem; color: var(--accent); margin-bottom: 5px; display: block;">Asistan Sesi:</label>
    <select id="voiceSelect" style="width:100%; padding:8px; border-radius:8px; background:var(--msg-ai); color:var(--text); border:1px solid var(--border); margin-bottom:10px;">
        <option value="none">🔇 Ses Kapalı</option>
        <option value="female_1" selected>👩 Kadın Sesi (Yumuşak)</option>
        <option value="female_2">👩 Kadın Sesi (Canlı)</option>
        <option value="male_1">👨 Erkek Sesi (Derin)</option>
        <option value="male_2">👨 Erkek Sesi (Resmi)</option>
        <option value="robot">🤖 Robotik Ses</option>
    </select>
    <button onclick="auth.signOut()" style="width:100%; background:#ef4444; color:white; border:none; padding:10px; border-radius:10px;">Çıkış Yap</button>
</div>

<script>
    // --- YENİLENMİŞ SES MOTORU ---
    function speakText(text) {
        const voiceSetting = document.getElementById('voiceSelect').value;
        
        // Ses kapalıysa hiçbir şey yapma
        if (voiceSetting === "none") return;

        window.speechSynthesis.cancel();
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        
        // Tarayıcıdaki tüm sesleri al
        const voices = synth.getVoices();
        // Türkçe sesleri filtrele
        const trVoices = voices.filter(v => v.lang.includes('tr'));

        utter.lang = 'tr-TR';

        // Ses Seçeneklerine Göre Pitch (İncelik) ve Rate (Hız) Ayarları
        switch(voiceSetting) {
            case "female_1": 
                utter.pitch = 1.2; utter.rate = 1.0; 
                if(trVoices[0]) utter.voice = trVoices[0];
                break;
            case "female_2": 
                utter.pitch = 1.4; utter.rate = 1.1; 
                if(trVoices[0]) utter.voice = trVoices[0];
                break;
            case "male_1": 
                utter.pitch = 0.7; utter.rate = 0.9; 
                // Eğer tarayıcıda varsa erkek sesi seçmeye çalışır
                const maleVoice = trVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('yelda') === false);
                if(maleVoice) utter.voice = maleVoice;
                break;
            case "male_2": 
                utter.pitch = 0.5; utter.rate = 0.85; 
                break;
            case "robot": 
                utter.pitch = 2.0; utter.rate = 0.7; 
                break;
        }

        synth.speak(utter);
    }

    // Tarayıcı sesleri yüklediğinde listeyi hazırla
    window.speechSynthesis.onvoiceschanged = () => {
        console.log("Sesler yüklendi, Neura hazır.");
    };
</script>
