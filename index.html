<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; --border: #1e293b; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #loginScreen { position:fixed; inset:0; background:var(--bg); z-index:3000; display:flex; align-items:center; justify-content:center; padding: 20px; }
        .auth-card { background: var(--panel); padding: 30px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 350px; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--border); background: #111827; color: white; box-sizing: border-box; }
        .auth-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; background: var(--accent); color: white; }
        #chatBox { flex: 1; overflow-y: auto; padding: 80px 20px 100px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; }
        .user { background: var(--accent); align-self: flex-end; }
        .ai { background: var(--panel); align-self: flex-start; border: 1px solid var(--border); }
        .input-area { position: fixed; bottom: 20px; left: 20px; right: 20px; display: flex; gap: 10px; background: #111827; padding: 10px; border-radius: 25px; border: 1px solid var(--border); }
        input#userInput { flex: 1; background: transparent; border: none; color: white; outline: none; padding-left: 10px; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="auth-card">
        <h2 style="color:var(--accent)">NEURA AI</h2>
        <input type="email" id="emailInput" class="auth-input" placeholder="E-posta">
        <input type="password" id="passInput" class="auth-input" placeholder="Şifre">
        <button onclick="mailLogin()" class="auth-btn">Giriş / Kayıt</button>
        <button onclick="guestLogin()" class="auth-btn" style="background:transparent; border:1px solid var(--border)">Misafir</button>
    </div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
    <div id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" style="background:var(--accent); border:none; color:white; width:40px; height:40px; border-radius:50%;"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
        authDomain: "neura-ai-c7b37.firebaseapp.com",
        projectId: "neura-ai-c7b37",
        storageBucket: "neura-ai-c7b37.firebasestorage.app",
        messagingSenderId: "105155389436",
        appId: "1:105155389436:web:e77111c9540b1568463479"
    };
    
    // DİKKAT: Cloudflare'den aldığın linki buraya yapıştır!
    const WORKER_URL = "https://neura.ozcanarel25.workers.dev/"; 

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    async function mailLogin() {
        const e = document.getElementById('emailInput').value;
        const p = document.getElementById('passInput').value;
        try { await auth.signInWithEmailAndPassword(e, p); } catch { await auth.createUserWithEmailAndPassword(e, p); }
    }
    async function guestLogin() { await auth.signInAnonymously(); }
    auth.onAuthStateChanged(u => { document.getElementById('loginScreen').style.display = u ? 'none' : 'flex'; });

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        input.value = "";

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            const aiResponse = data.choices[0].message.content;

            // Firestore'a Kayıt (Okuyabilmen için)
            const user = auth.currentUser;
            await db.collection("chat_history").add({
                email: user.email || "Misafir",
                user_query: text,
                ai_answer: aiResponse,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            addMsg(aiResponse, 'ai');
        } catch (err) {
            addMsg("Bağlantı Hatası: Lütfen Worker linkini kontrol edin.", "ai");
        }
    }

    function addMsg(t, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerText = t;
        const b = document.getElementById('chatBox');
        b.appendChild(d);
        b.scrollTop = b.scrollHeight;
    }
</script>
</body>
</html>
