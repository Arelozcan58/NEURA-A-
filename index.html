<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI | Cloud & Theme</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Dinamik Tema Değişkenleri */
        :root { 
            --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; 
            --msg-ai: #1e293b; --border: #1e293b; --input-bg: #111827;
        }
        
        /* Beyaz Tema Değişkenleri */
        body.light-mode {
            --bg: #f8fafc; --panel: #ffffff; --accent: #2563eb; --text: #1e293b;
            --msg-ai: #f1f5f9; --border: #e2e8f0; --input-bg: #ffffff;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* Tema Butonu */
        .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 1100; background: var(--panel); border: 1px solid var(--border); color: var(--text); width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* Sidebar & Layout */
        .sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel); transition: 0.4s; z-index: 1000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .user-info img { width: 40px; border-radius: 50%; border: 2px solid var(--accent); }

        .main-content { flex: 1; display: flex; flex-direction: column; }
        #chatBox { flex: 1; overflow-y: auto; padding: 90px 20px 30px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Mesaj Balonları */
        .msg { padding: 14px 18px; border-radius: 15px; max-width: 80%; font-size: 0.95rem; line-height: 1.5; }
        .user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: var(--msg-ai); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border); }

        .input-area { padding: 25px; }
        .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; background: var(--input-bg); padding: 10px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        input { flex: 1; background: transparent; border: none; color: var(--text); padding: 10px; outline: none; }
        
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1100; background: var(--panel); border: 1px solid var(--border); color: var(--text); width: 45px; height: 45px; border-radius: 12px; cursor: pointer; }
        #loginScreen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="dark-mode">

    <div id="loginScreen">
        <h1 style="color: var(--accent); letter-spacing: 5px;">NEURA AI</h1>
        <button class="login-btn" onclick="googleLogin()" style="background:var(--accent); color:white; padding:15px 30px; border-radius:50px; border:none; font-weight:bold; cursor:pointer;">
            Google ile Giriş Yap
        </button>
    </div>

    <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fas fa-bars"></i></button>
    <button class="theme-toggle" onclick="toggleTheme()"><i id="themeIcon" class="fas fa-moon"></i></button>

    <div class="sidebar" id="sidebar">
        <div class="user-info" id="userInfo"></div>
        <button onclick="createNewChat()" style="width:100%; background:var(--accent); color:white; border:none; padding:12px; border-radius:10px; cursor:pointer; font-weight:bold; margin-bottom:20px;">+ Yeni Sohbet</button>
        <div id="sessionList" style="flex:1; overflow-y:auto;"></div>
        <button onclick="auth.signOut()" style="background:#7f1d1d; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer; margin-top:10px;">Çıkış Yap</button>
    </div>

    <div class="main-content">
        <div id="chatBox"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Bir şeyler yazın...">
                <button onclick="sendMessage()" style="background:var(--accent); border:none; color:white; padding:0 25px; border-radius:12px; cursor:pointer; font-weight:bold;">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        // --- BURAYI KENDİ BİLGİLERİNLE DOLDUR ---
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };
        // ----------------------------------------

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";

        let currentUser = null;
        let sessions = [];
        let currentSessionId = null;

        // --- TEMA YÖNETİMİ ---
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                icon.className = 'fas fa-moon';
                localStorage.setItem('neura-theme', 'dark');
            } else {
                body.classList.add('light-mode');
                icon.className = 'fas fa-sun';
                localStorage.setItem('neura-theme', 'light');
            }
        }

        // Sayfa açıldığında eski temayı yükle
        if (localStorage.getItem('neura-theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeIcon').className = 'fas fa-sun';
        }

        // --- AUTH & FIRESTORE İŞLEMLERİ (Öncekiyle Aynı) ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                updateUserInfoUI();
                syncDataFromCloud();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        });

        async function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            await auth.signInWithPopup(provider);
        }

        function updateUserInfoUI() {
            document.getElementById('userInfo').innerHTML = `
                <img src="${currentUser.photoURL}">
                <div>
                    <div style="font-weight:bold; font-size:0.9rem;">${currentUser.displayName}</div>
                    <div style="font-size:0.7rem; color:#64748b;">${currentUser.email}</div>
                </div>
            `;
        }

        async function syncDataFromCloud() {
            db.collection('users').doc(currentUser.uid).collection('sessions')
              .orderBy('timestamp', 'desc')
              .onSnapshot(snapshot => {
                  sessions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  renderSessionList();
                  if (!currentSessionId && sessions.length > 0) loadSession(sessions[0].id);
              });
        }

        async function createNewChat() {
            const newSession = { title: "Yeni Sohbet", messages: [], timestamp: firebase.firestore.FieldValue.serverTimestamp() };
            const docRef = await db.collection('users').doc(currentUser.uid).collection('sessions').add(newSession);
            currentSessionId = docRef.id;
            loadSession(currentSessionId);
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = "";
            if (session && session.messages) session.messages.forEach(m => renderMessage(m.role, m.content));
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || !currentSessionId) return;

            const session = sessions.find(s => s.id === currentSessionId);
            const updatedMessages = [...(session.messages || []), { role: "user", content: text }];
            renderMessage('user', text);
            input.value = "";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{ role: "system", content: "Adın Neura AI. Geliştiricin Arel." }, ...updatedMessages] })
                });
                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                await db.collection('users').doc(currentUser.uid).collection('sessions').doc(currentSessionId).update({
                    messages: [...updatedMessages, { role: "assistant", content: aiMsg }],
                    title: session.messages.length === 0 ? text.substring(0, 20) : session.title
                });
                renderMessage('assistant', aiMsg);
            } catch (err) { console.error(err); }
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = "";
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = `session-item`;
                div.style = `padding:10px; background:rgba(255,255,255,0.05); margin-bottom:5px; border-radius:8px; cursor:pointer; font-size:0.85rem; border:1px solid ${s.id === currentSessionId ? 'var(--accent)' : 'transparent'}; color:var(--text);`;
                div.innerText = s.title;
                div.onclick = () => loadSession(s.id);
                list.appendChild(div);
            });
        }
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
