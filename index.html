<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neura AI | Premium UI</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #05070a; --panel: #0f172a; --accent: #3b82f6; --text: #e2e8f0; 
            --msg-ai: #1e293b; --border: #1e293b; --input-bg: #111827; --radius: 12px;
        }
        
        body.light-mode {
            --bg: #f8fafc; --panel: #ffffff; --accent: #2563eb; --text: #1e293b;
            --msg-ai: #f1f5f9; --border: #e2e8f0; --input-bg: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s; }

        /* Animasyonlar */
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .btn-anim { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-anim:hover { transform: translateY(-2px); filter: brightness(1.2); cursor: pointer; }
        .btn-anim:active { transform: scale(0.95); }

        /* Sidebar Responsive */
        .sidebar { position: fixed; left: -100%; top: 0; width: 85%; max-width: 300px; height: 100%; background: var(--panel); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; box-shadow: 20px 0 60px rgba(0,0,0,0.5); }
        
        @media (min-width: 1024px) {
            .sidebar { position: relative; left: 0; width: 300px; }
            .menu-toggle { display: none; }
        }

        /* Ana İçerik */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
        #chatBox { flex: 1; overflow-y: auto; padding: 80px 15px 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .msg { padding: 12px 16px; border-radius: var(--radius); max-width: 85%; font-size: 0.92rem; animation: pop 0.3s ease-out; word-wrap: break-word; }
        .user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .ai { background: var(--msg-ai); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border); }

        /* Üst Bar */
        .top-bar { position: absolute; top: 0; width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(var(--bg), 0.8); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border); }
        
        /* Input Responsive */
        .input-area { padding: 15px; background: var(--bg); }
        .input-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; background: var(--input-bg); padding: 8px; border-radius: 20px; border: 1px solid var(--border); }
        input { flex: 1; background: transparent; border: none; color: var(--text); padding: 10px; outline: none; font-size: 1rem; }

        /* Ayarlar Paneli */
        #settingsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--panel); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; border: 1px solid var(--border); animation: pop 0.3s; }

        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1500; }
        .overlay.active { display:block; }
    </style>
</head>
<body class="dark-mode">

    <div id="loginScreen">
        <h1 class="btn-anim" style="color: var(--accent); font-size: 2.5rem;">NEURA</h1>
        <button class="login-btn btn-anim" onclick="googleLogin()" style="background:var(--accent); color:white; padding:15px 40px; border-radius:50px; border:none; font-weight:bold; margin-top:20px;">Google ile Başlat</button>
    </div>

    <div class="overlay" onclick="closeSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="user-info" id="userInfo"></div>
        <button class="btn-anim" onclick="createNewChat()" style="width:100%; background:var(--accent); color:white; border:none; padding:14px; border-radius:var(--radius); font-weight:bold; margin-bottom:20px;">+ Yeni Sohbet</button>
        <div id="sessionList" style="flex:1; overflow-y:auto;"></div>
        <button class="btn-anim" onclick="toggleSettings()" style="background:transparent; color:var(--text); border:1px solid var(--border); padding:10px; border-radius:var(--radius); margin-top:10px;"><i class="fas fa-cog"></i> Ayarlar</button>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle btn-anim" onclick="openSidebar()" style="background:none; border:none; color:var(--text); font-size:1.5rem;"><i class="fas fa-bars"></i></button>
            <span style="font-weight:bold; letter-spacing:2px; color:var(--accent);">NEURA AI</span>
            <button class="btn-anim" onclick="toggleTheme()" style="background:none; border:none; color:var(--text); font-size:1.2rem;"><i id="themeIcon" class="fas fa-moon"></i></button>
        </div>

        <div id="chatBox"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Mesaj gönder..." autocomplete="off">
                <button class="btn-anim" onclick="sendMessage()" style="background:var(--accent); border:none; color:white; width:45px; height:45px; border-radius:15px;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <h2 style="margin-top:0;">Özelleştirme</h2>
            <p style="font-size:0.9rem; color:#64748b;">Arayüz ayarlarını buradan yapabilirsin.</p>
            <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span>Koyu Tema</span>
                <button class="btn-anim" onclick="toggleTheme()" style="padding:8px 15px; border-radius:10px; background:var(--msg-ai); border:1px solid var(--border); color:var(--text);">Değiştir</button>
            </div>
            <button class="btn-anim" onclick="auth.signOut()" style="width:100%; background:#ef4444; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; margin-top:20px;">Oturumu Kapat</button>
            <button class="btn-anim" onclick="toggleSettings()" style="width:100%; background:transparent; color:var(--text); border:none; margin-top:15px;">Kapat</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAstwONxkqv8M-DAUjZ2y5RCEI9h2dEtiw",
            authDomain: "neura-ai-c7b37.firebaseapp.com",
            projectId: "neura-ai-c7b37",
            storageBucket: "neura-ai-c7b37.firebasestorage.app",
            messagingSenderId: "105155389436",
            appId: "1:105155389436:web:e77111c9540b1568463479"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";

        let currentUser = null, sessions = [], currentSessionId = null;

        // --- UI Fonksiyonları ---
        function openSidebar() { document.getElementById('sidebar').classList.add('active'); document.querySelector('.overlay').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('active'); document.querySelector('.overlay').classList.remove('active'); }
        function toggleSettings() { const m = document.getElementById('settingsModal'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
        
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeIcon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('neura-theme', isLight ? 'light' : 'dark');
        }

        // --- Firebase & Sohbet (Öncekiyle Aynı Mantık) ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                updateUserInfoUI();
                syncDataFromCloud();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        });

        async function googleLogin() { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        function updateUserInfoUI() {
            document.getElementById('userInfo').innerHTML = `<img src="${currentUser.photoURL}"><div><div style="font-weight:bold; font-size:0.9rem;">${currentUser.displayName}</div><div style="font-size:0.7rem; color:#64748b;">${currentUser.email}</div></div>`;
        }

        async function syncDataFromCloud() {
            db.collection('users').doc(currentUser.uid).collection('sessions').orderBy('timestamp', 'desc')
              .onSnapshot(snap => {
                  sessions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                  renderSessionList();
                  if (!currentSessionId && sessions.length > 0) loadSession(sessions[0].id);
              });
        }

        async function createNewChat() {
            const doc = await db.collection('users').doc(currentUser.uid).collection('sessions').add({
                title: "Yeni Sohbet", messages: [], timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            currentSessionId = doc.id;
            loadSession(doc.id);
            closeSidebar();
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            const box = document.getElementById('chatBox');
            box.innerHTML = "";
            if (session?.messages) session.messages.forEach(m => renderMessage(m.role, m.content));
            renderSessionList();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || !currentSessionId) return;

            renderMessage('user', text);
            input.value = "";
            const session = sessions.find(s => s.id === currentSessionId);
            const updated = [...(session.messages || []), { role: "user", content: text }];

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{ role: "system", content: `Adın Neura AI. Geliştiricin Arel. Kullanıcı: ${currentUser.displayName}.` }, ...updated] })
                });
                const data = await res.json();
                const aiMsg = data.choices[0].message.content;
                await db.collection('users').doc(currentUser.uid).collection('sessions').doc(currentSessionId).update({
                    messages: [...updated, { role: "assistant", content: aiMsg }],
                    title: session.messages.length === 0 ? text.substring(0, 20) : session.title
                });
                renderMessage('assistant', aiMsg);
            } catch (e) { console.error(e); }
        }

        function renderMessage(role, content) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = "";
            sessions.forEach(s => {
                const active = s.id === currentSessionId;
                const div = document.createElement('div');
                div.className = "btn-anim";
                div.style = `padding:12px; background:${active ? 'rgba(59,130,246,0.1)' : 'transparent'}; margin-bottom:5px; border-radius:10px; cursor:pointer; font-size:0.85rem; border:1px solid ${active ? 'var(--accent)' : 'transparent'}; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;`;
                div.innerHTML = `<i class="far fa-comment" style="margin-right:8px; color:var(--accent);"></i> ${s.title}`;
                div.onclick = () => { loadSession(s.id); closeSidebar(); };
                list.appendChild(div);
            });
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
        if (localStorage.getItem('neura-theme') === 'light') toggleTheme();
    </script>
</body>
</html>
