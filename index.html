<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI | Arel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Modern Hamburger Menü */
        .sidebar {
            position: fixed; left: -280px; top: 0; width: 260px; height: 100%;
            background: var(--panel); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px;
        }
        .sidebar.active { left: 0; box-shadow: 15px 0 40px rgba(0,0,0,0.7); }
        
        .menu-toggle {
            position: fixed; top: 20px; left: 20px; z-index: 1100;
            background: var(--accent); border: none; color: white;
            width: 45px; height: 45px; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* Sidebar Başlıkları */
        .sidebar h2 { font-size: 1.4rem; color: var(--accent); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .sidebar h3 { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin-top: 30px; letter-spacing: 1.5px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        
        /* Liste Temizliği */
        .history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
        .history-item { 
            padding: 12px; background: rgba(15, 23, 42, 0.4); border-radius: 8px; 
            margin-bottom: 10px; font-size: 0.85rem; border: 1px solid #334155;
            color: #cbd5e1; transition: 0.2s;
        }
        .history-item.active-topic { border-color: var(--accent); color: white; background: rgba(59, 130, 246, 0.1); }

        /* Mesaj Balonları */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; transition: 0.4s; }
        #chatBox { flex: 1; overflow-y: auto; padding: 80px 20px 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 14px 18px; border-radius: 18px; max-width: 80%; line-height: 1.6; font-size: 0.95rem; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .ai { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }

        /* Giriş Barı */
        .input-area { padding: 25px; background: linear-gradient(transparent, var(--bg) 40%); }
        .input-wrapper { max-width: 750px; margin: 0 auto; display: flex; gap: 12px; background: var(--panel); padding: 8px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px 15px; outline: none; font-size: 1rem; }
        button#sendBtn { background: var(--accent); border: none; color: white; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button#sendBtn:hover { filter: brightness(1.2); }

        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; backdrop-filter: blur(4px); }
        .overlay.active { display:block; }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <h2><i class="fas fa-bolt"></i> Neura AI</h2>
        
        <h3>Mevcut Konu</h3>
        <div id="topicTitle" class="history-item active-topic">Sohbet Başlatılmadı</div>
        
        <h3>İstatistikler</h3>
        <div class="history-item"><i class="fas fa-user"></i> Sahibi: Arel</div>
        <div class="history-item"><i class="fas fa-layer-group"></i> Model: Llama 3.3</div>
        
        <div style="margin-top: auto;">
            <div class="history-item" onclick="clearChat()" style="cursor:pointer; color:#f87171; border-color:#7f1d1d;"><i class="fas fa-trash-alt"></i> Tüm Belleği Sil</div>
        </div>
    </div>

    <div class="main-content">
        <div id="chatBox"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Arel'in yapay zekasına bir şeyler yaz...">
                <button onclick="sendMessage()" id="sendBtn">GÖNDER</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";
        let chatHistory = JSON.parse(localStorage.getItem('neura_final_clean')) || [];

        const IDENTITY = { 
            role: "system", 
            content: "Senin adın Neura AI. Geliştiricin ve tek sahibin Arel'dir. Meta veya başkasıyla ilgin yok. Sadece Arel'in emirlerini yerine getiren, onun tarafından kodlanmış özel bir zekasın." 
        };

        window.onload = () => {
            updateSidebarUI();
            if(chatHistory.length > 0) {
                chatHistory.forEach(m => renderMessage(m.role, m.content));
            } else {
                renderMessage('assistant', "Sistem Aktif. Ben Neura AI, geliştiricim Arel'in hizmetindeyim. Nasıl yardımcı olabilirim?");
            }
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = "";
            btn.disabled = true;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [IDENTITY, ...chatHistory] })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                
                addMessage('assistant', aiMsg);
                localStorage.setItem('neura_final_clean', JSON.stringify(chatHistory));
                updateSidebarUI();
            } catch (err) {
                renderMessage('assistant', "Hata: Sunucuya bağlanılamadı.");
            } finally {
                btn.disabled = false;
            }
        }

        function addMessage(role, content) {
            chatHistory.push({ role, content });
            renderMessage(role, content);
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // BURASI KRİTİK: Listeyi kalabalıklaştırmak yerine sadece ana konuyu gösterir.
        function updateSidebarUI() {
            const topic = document.getElementById('topicTitle');
            const userMessages = chatHistory.filter(m => m.role === 'user');
            
            if (userMessages.length > 0) {
                // Sadece ilk mesajı "Konu Başlığı" olarak belirler
                topic.innerText = "Konu: " + userMessages[0].content;
            }
        }

        function clearChat() {
            localStorage.removeItem('neura_final_clean');
            location.reload();
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
