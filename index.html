<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura AI</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        
        /* Hamburger Menü Stilleri */
        .menu-btn { position: fixed; top: 15px; left: 15px; z-index: 100; cursor: pointer; font-size: 24px; background: none; border: none; color: white; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: var(--panel); transition: 0.3s; z-index: 99; padding: 60px 15px 20px; border-right: 1px solid #334155; }
        .sidebar.active { left: 0; }
        .sidebar h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .history-item { padding: 10px; margin: 5px 0; background: #0f172a; border-radius: 5px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Ana Chat Alanı */
        .container { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; transition: 0.3s; }
        header { text-align: center; padding: 20px; border-bottom: 1px solid #334155; }
        #chatBox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
        .user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }

        /* Giriş Alanı */
        .input-area { padding: 20px; display: flex; gap: 10px; background: var(--bg); }
        input { flex: 1; background: var(--panel); border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; outline: none; }
        button#sendBtn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:98; }
        .overlay.active { display:block; }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <h3>Önceki Sohbetler</h3>
        <div id="historyList"></div>
        <br>
        <h3>Ayarlar</h3>
        <div class="history-item" onclick="clearChat()">🗑 Belleği Temizle</div>
        <div class="history-item">⚙️ Model: Llama 3.3</div>
    </div>

    <div class="container">
        <header>
            <h2 style="margin:0; color: #60a5fa;">Neura AI</h2>
            <small style="color: #94a3b8;">Geliştirici: Arel</small>
        </header>

        <div id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Mesajınızı buraya yazın...">
            <button onclick="sendMessage()" id="sendBtn">Gönder</button>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://neura.ozcanarel25.workers.dev";
        let chatHistory = JSON.parse(localStorage.getItem('neura_v2')) || [];

        // KİMLİK TANIMLAMA: Neura AI ve Arel bilgisi sisteme enjekte ediliyor
        const SYSTEM_PROMPT = { 
            role: "system", 
            content: "Senin adın Neura AI. Geliştiricin Arel adında zeki bir yazılımcıdır. Sana kim olduğun sorulursa her zaman bu bilgiyi ver. Nazik, profesyonel ve yardımcı ol." 
        };

        window.onload = () => {
            refreshHistoryMenu();
            if(chatHistory.length > 0) {
                chatHistory.forEach(m => renderMessage(m.role, m.content));
            } else {
                renderMessage('assistant', "Merhaba! Ben Neura AI. Geliştiricim Arel tarafından özel olarak tasarlandım. Sana nasıl yardımcı olabilirim?");
            }
        };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = "";
            btn.disabled = true;

            try {
                // Sistem promptunu her zaman listenin başına ekliyoruz ki unutmasın
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [SYSTEM_PROMPT, ...chatHistory] })
                });

                const data = await response.json();
                const aiMsg = data.choices[0].message.content;
                
                addMessage('assistant', aiMsg);
                localStorage.setItem('neura_v2', JSON.stringify(chatHistory));
                refreshHistoryMenu();
            } catch (err) {
                renderMessage('assistant', "Bağlantı hatası: Worker çalışmıyor.");
            } finally {
                btn.disabled = false;
            }
        }

        function addMessage(role, content) {
            chatHistory.push({ role, content });
            renderMessage(role, content);
        }

        function renderMessage(role, content) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function refreshHistoryMenu() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            // Sadece kullanıcı mesajlarını geçmişte göster
            chatHistory.filter(m => m.role === 'user').slice(-5).forEach(m => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = m.content;
                list.appendChild(item);
            });
        }

        function clearChat() {
            localStorage.removeItem('neura_v2');
            location.reload();
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
